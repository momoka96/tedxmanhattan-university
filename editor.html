<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TEDx Manhattan University — Visual Editor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/grapesjs@0.22.5/dist/css/grapes.min.css">
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:Inter,Arial,sans-serif;color:#171717}
#topbar{position:sticky;top:0;z-index:1000000;width:100%;min-height:58px;background:#111;color:#fff;display:flex;align-items:center;gap:10px;padding:10px 14px;flex-wrap:wrap;box-shadow:0 2px 10px rgba(0,0,0,.2)}
#topbar strong{margin-right:auto}#topbar .brand{color:#e62b1e}.btn{border:0;border-radius:7px;padding:9px 13px;font-weight:700;cursor:pointer}.save{background:#e62b1e;color:#fff}.plain{background:#333;color:#fff}.hint{font-size:12px;color:#bbb}
#gjs{height:calc(100vh - 58px)}
.gjs-one-bg{background:#f5f4f0}.gjs-two-color{color:#222}.gjs-three-bg{background:#e62b1e;color:#fff}.gjs-four-color,.gjs-four-color-h:hover{color:#e62b1e}
#status{font-size:12px;color:#ddd;max-width:220px}#topbar button{flex-shrink:0}
@media(max-width:700px){#topbar{gap:6px}#topbar strong{width:100%}.hint{display:none}#gjs{height:calc(100vh - 105px)}}
</style>
</head>
<body>
<div id="topbar">
  <strong><span class="brand">TEDx</span> Manhattan University · Visual Editor</strong>
  <span class="hint">Select text to edit · drag elements · style them on the right</span>
  <button class="btn plain" id="preview">Preview</button>
  <button class="btn plain" id="uploadButton">Add/replace image</button>
  <input id="imageFile" type="file" accept="image/*" hidden>
  <button class="btn plain" id="save">Download backup</button>
  <button class="btn save" id="publish">Publish website</button>
  <span id="status">Loading your website…</span>
</div>
<div id="gjs"></div>
<script src="https://unpkg.com/grapesjs@0.22.5/dist/grapes.min.js"></script>
<script>
(async function(){
  const status = document.getElementById('status');
  let editor;
  try {
    const results = await Promise.all([
      fetch('index.html', {cache:'no-store'}),
      fetch('style.css', {cache:'no-store'})
    ]);
    if (!results[0].ok || !results[1].ok) throw new Error('Could not load index.html or style.css. Make sure editor.html is in the same folder as your website.');
    const html = await results[0].text();
    const css = await results[1].text();
    const parsed = new DOMParser().parseFromString(html, 'text/html');
    parsed.body.querySelectorAll('script').forEach(function(s){s.remove();});
    const components = parsed.body.innerHTML;
    editor = grapesjs.init({
      container:'#gjs',
      height:'100%',
      fromElement:false,
      storageManager:false,
      components:components,
      style:css,
      canvas:{styles:[
        'https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap'
      ]},
      blockManager:{appendTo:'.gjs-pn-views-container',blocks:[
        {id:'section',label:'Section',category:'Add elements',content:'<section class="section"><p class="eyebrow">Section label</p><h2>New section</h2><p class="section-copy">Click here to edit this text.</p></section>'},
        {id:'heading',label:'Heading',category:'Add elements',content:'<h2>New heading</h2>'},
        {id:'text',label:'Text',category:'Add elements',content:'<p>Click to edit this paragraph.</p>'},
        {id:'button',label:'Button',category:'Add elements',content:'<a class="button primary" href="#register">New button</a>'},
        {id:'image',label:'Image',category:'Add elements',content:{type:'image',style:{width:'100%',height:'auto'},src:'https://placehold.co/800x450?text=Choose+an+image'}},
        {id:'columns',label:'Two columns',category:'Add elements',content:'<div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px;padding:24px"><div><h3>Column one</h3><p>Edit this text.</p></div><div><h3>Column two</h3><p>Edit this text.</p></div></div>'}
      ]},
      selectorManager:{componentFirst:true},
      styleManager:{sectors:[
        {name:'Layout',open:true,buildProps:['display','position','width','height','min-height','margin','padding','gap','align-items','justify-content','grid-template-columns']},
        {name:'Typography',open:false,buildProps:['font-family','font-size','font-weight','line-height','letter-spacing','text-align','color']},
        {name:'Background',open:false,buildProps:['background-color','background-image','background-size','background-position','background-repeat']},
        {name:'Borders & effects',open:false,buildProps:['border','border-radius','box-shadow','opacity']}
      ]}
    });
    status.textContent = 'Website loaded';
    document.getElementById('preview').addEventListener('click',function(){editor.runCommand('core:preview');});
    document.getElementById('uploadButton').addEventListener('click',function(){
      const selected = editor.getSelected();
      if (selected && (selected.get('type') === 'image' || selected.get('tagName') === 'img')) {
        document.getElementById('imageFile').click();
      } else {
        alert('First select an image in the page, or add an Image block. Then click Add/replace image.');
      }
    });
    document.getElementById('imageFile').addEventListener('change',function(e){
      const file = e.target.files && e.target.files[0];
      const selected = editor.getSelected();
      if (!file || !selected) return;
      const reader = new FileReader();
      reader.onload = function(){selected.set('src', reader.result); status.textContent='Image added — remember to download and publish';};
      reader.readAsDataURL(file);
      e.target.value='';
    });
    function getWebsiteFiles(){
      const page = '<!doctype html>\n<html lang="en">\n<head>\n<meta charset="UTF-8">\n<meta name="viewport" content="width=device-width, initial-scale=1.0">\n<title>TEDxManhattan University</title>\n<link rel="preconnect" href="https://fonts.googleapis.com">\n<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>\n<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">\n<link rel="stylesheet" href="style.css">\n</head>\n<body>\n' + editor.getHtml() + '\n<script src="script.js"><\/script>\n</body>\n</html>';
      return { 'index.html': page, 'style.css': editor.getCss() };
    }
    document.getElementById('save').addEventListener('click',function(){
      const files = getWebsiteFiles();
      download('index.html', files['index.html'], 'text/html');
      download('style.css', files['style.css'], 'text/css');
      status.textContent='Downloaded index.html and style.css';
      alert('Backup downloaded. Use Publish website to send these changes to your live site.');
    });
    document.getElementById('publish').addEventListener('click', async function(){
      const button = this;
      button.disabled = true;
      status.textContent = 'Publishing…';
      try {
        const files = getWebsiteFiles();
        const response = await fetch('https://tedxmanhattan-university.mabdulkarim01.workers.dev', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ files: files })
        });
        const result = await response.json().catch(function(){ return {}; });
        if (!response.ok) throw new Error(result.error || result.message || ('Publishing failed (HTTP ' + response.status + ')'));
        status.textContent = 'Published successfully';
        alert('Your website changes were sent for publishing. It may take a few minutes for the live site to update.');
      } catch (err) {
        status.textContent = 'Publishing failed';
        alert('Could not publish: ' + (err.message || err) + '\n\nThe Cloudflare Worker must accept publishing without EDITOR_PASSWORD. Keep your GitHub token stored as a Cloudflare secret.');
      } finally {
        button.disabled = false;
      }
    });
  } catch (err) {
    status.textContent = 'Could not load editor';
    document.getElementById('gjs').innerHTML = '<div style="padding:24px;font:16px Arial"><h2>Could not load the website editor</h2><p>' + String(err.message || err) + '</p><p>Open this page from your published GitHub Pages website, not as a local file. Check that index.html and style.css are in the same folder.</p></div>';
  }
  function download(name, content, type){
    const blob = new Blob([content], {type:type+';charset=utf-8'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){URL.revokeObjectURL(url);},1500);
  }
})();
</script>
</body>
</html>
